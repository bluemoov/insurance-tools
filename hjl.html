<style>
:root{--bg:#f1f7fc;--surface:#fff;--fg:#132233;--muted:#5a6c7e;--line:#d4e3f0;--accent:#1a73b8;--warn:#9a5b00}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px;width:100%;max-width:340px}
h1{font-size:18px;margin:0} p{margin:0;font-size:13px;color:var(--muted)}
input[type=password]{font-size:20px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;letter-spacing:.2em}
button{font-size:16px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:var(--surface);font-weight:700;cursor:pointer}
label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
#err{color:var(--warn);font-size:13px} a{color:var(--accent);font-size:13px;text-decoration:none}
[hidden]{display:none!important}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY="tool-key-"+D.salt;
async function open_(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},k,b(D.ct));
  const h=new TextDecoder().decode(p);
  document.open();document.write(h);document.close();
}
async function derive(pw){
  const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b(D.salt),iterations:D.iter},m,256));
}
(async()=>{try{const s=localStorage.getItem(KEY);if(s)await open_(b(s))}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const g=document.getElementById("go"),er=document.getElementById("err");
  er.hidden=true;g.disabled=true;g.textContent="解鎖中…";
  try{const raw=await derive(document.getElementById("pw").value);
    const keep=document.getElementById("keep").checked;
    await open_(raw);
    if(keep)try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)))}catch(_){}
